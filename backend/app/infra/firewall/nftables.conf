#!/usr/sbin/nft -f          # Exécutable par nft
flush ruleset               # Reset anciennes règles

table inet filter {         # Table IPv4+IPv6
    chain input {           # Paquets entrants
        type filter hook input priority 0; policy drop;  # Par défaut : tout bloquer

        iif "lo" accept     # Autoriser loopback (interne)
        ct state established,related accept  # Autoriser réponses aux requêtes sortantes

        # Ping limité à 5/sec (IPv4 + IPv6)
        ip protocol icmp icmp type { echo-request, echo-reply } limit rate 5/second accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, echo-reply } limit rate 5/second accept

        # SSH : max 3 connexions/minute par IP
        tcp dport 22 ct state new limit rate over 3/minute drop
        tcp dport 22 accept

        # HTTPS/WebSocket : max 20 connexions/seconde par IP
        tcp dport 443 ct state new limit rate over 20/second drop
        tcp dport 443 accept

        log prefix "nftables DROP: " limit rate 5/minute  # Logger les rejets
        counter drop        # Tout le reste = rejeté
    }

    chain forward {         # Pas de routage
        type filter hook forward priority 0; policy drop;
    }

    chain output {          # Sortie libre
        type filter hook output priority 0; policy accept;
    }
}                           # Fermeture table inet filter